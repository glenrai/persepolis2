<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Persepolis 2: The Story of a Return</title>
  <style>
    :root {
      --bg: #ececec;
      --panel: #ffffff;
      --text: #171717;
      --muted: #666666;
      --shadow: 0 4px 22px rgba(0, 0, 0, 0.16);
      --page-width: 560px;
      --gap: 18px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #cccccc;
    }
    .title {
      margin-right: auto;
      font-weight: 750;
    }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    button,
    input {
      font: inherit;
    }
    button {
      padding: 7px 10px;
      cursor: pointer;
      background: #ffffff;
      border: 1px solid #aaaaaa;
      border-radius: 8px;
    }
    button:hover {
      background: #f2f2f2;
    }
    input[type="number"] {
      width: 70px;
      padding: 7px;
      border: 1px solid #aaaaaa;
      border-radius: 8px;
    }
    input[type="range"] {
      width: 130px;
    }
    main {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, var(--page-width)));
      justify-content: center;
      align-items: start;
      gap: 28px var(--gap);
      padding: 22px 12px 60px;
    }
    .page {
      width: var(--page-width);
      margin: 0;
      background: var(--panel);
      box-shadow: var(--shadow);
      line-height: 0;
      scroll-margin-top: 70px;
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 8px;
      background: #fafafa;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
    }
    body.single main {
      grid-template-columns:
        minmax(0, var(--page-width));
    }
    body.dark {
      --bg: #151515;
      --panel: #222222;
      --text: #eeeeee;
      --muted: #bbbbbb;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
    }
    body.dark header {
      background: rgba(28, 28, 28, 0.94);
      border-color: #444444;
    }
    body.dark button,
    body.dark input {
      background: #2b2b2b;
      color: #eeeeee;
      border-color: #666666;
    }
    body.dark figcaption {
      background: #222222;
    }
    .theEnd {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 0 0;
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #resumeBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #aaaaaa;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
    }
    #resumeBtn.visible {
      display: flex;
    }
    #resumeBtn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d9534f;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns:
          minmax(0, min(var(--page-width), 96vw));
      }
      .page {
        width: min(var(--page-width), 96vw);
      }
      #viewMode {
        display: none;
      }
    }
    @media print {
      header,
      figcaption,
      #resumeBtn {
        display: none;
      }
      body {
        background: #ffffff;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        padding: 0;
      }
      .page {
        width: 100%;
        margin: 0;
        box-shadow: none;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      Persepolis 2: The Story of a Return
    </div>
    <div class="controls">
      <button id="prev" type="button">
        Previous
      </button>
      <label>
        Page
        <input
          id="pageInput"
          type="number"
          min="1"
          max="192"
          value="1"
        >
        / 192
      </label>
      <button id="next" type="button">
        Next
      </button>
      <label>
        Page width
        <input
          id="zoom"
          type="range"
          min="320"
          max="1000"
          step="20"
          value="560"
        >
      </label>
      <button id="viewMode" type="button">
        Single page
      </button>
      <button id="theme" type="button">
        Dark mode
      </button>
      <button id="full" type="button">
        Fullscreen
      </button>
    </div>
  </header>

  <main id="reader"></main>

  <button id="resumeBtn" type="button">
    <span class="dot"></span>
    <span id="resumeLabel">Resume reading</span>
  </button>

  <script>
    const totalPages = 192;
    const reader = document.getElementById("reader");
    const pageInput = document.getElementById("pageInput");
    const previousButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const zoomControl = document.getElementById("zoom");
    const viewModeButton = document.getElementById("viewMode");
    const themeButton = document.getElementById("theme");
    const fullscreenButton = document.getElementById("full");
    const resumeBtn = document.getElementById("resumeBtn");
    const resumeLabel = document.getElementById("resumeLabel");

    const SAVE_KEY = "persepolis2-last-page";

    function saveLastPage(pageNumber) {
      try {
        localStorage.setItem(SAVE_KEY, String(pageNumber));
      } catch (error) {
        /* storage unavailable, ignore */
      }
    }

    function loadLastPage() {
      try {
        return Number(localStorage.getItem(SAVE_KEY)) || 1;
      } catch (error) {
        return 1;
      }
    }

    /*
      Pages are images stored next to this file:
      page-001.jpg, page-002.jpg, and so on.
    */
    for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
      const paddedNumber = String(pageNumber).padStart(3, "0");
      const figure = document.createElement("figure");
      figure.className = "page";
      figure.id = `page-${pageNumber}`;
      const image = document.createElement("img");
      image.src = `page-${paddedNumber}.jpg`;
      image.alt = `Persepolis 2 page ${pageNumber}`;
      image.style.aspectRatio = "auto 1000 / 1555";
      image.loading = pageNumber <= 4 ? "eager" : "lazy";
      const caption = document.createElement("figcaption");
      caption.textContent =
        `Page ${pageNumber} of ${totalPages}`;
      figure.appendChild(image);
      figure.appendChild(caption);
      reader.appendChild(figure);
    }

    const endMark = document.createElement("div");
    endMark.className = "theEnd";
    endMark.textContent = "The End";
    reader.appendChild(endMark);

    function pageStep() {
      return document.body.classList.contains("single")
        ? 1
        : 2;
    }
    function goToPage(pageNumber) {
      let targetPage = Number(pageNumber);
      if (!Number.isFinite(targetPage)) {
        targetPage = 1;
      }
      targetPage = Math.max(
        1,
        Math.min(totalPages, targetPage)
      );
      pageInput.value = targetPage;
      const target = document.getElementById(
        `page-${targetPage}`
      );
      if (target) {
        target.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }
    previousButton.addEventListener("click", () => {
      goToPage(
        Number(pageInput.value) - pageStep()
      );
    });
    nextButton.addEventListener("click", () => {
      goToPage(
        Number(pageInput.value) + pageStep()
      );
    });
    pageInput.addEventListener("change", () => {
      goToPage(pageInput.value);
    });
    zoomControl.addEventListener("input", event => {
      document.documentElement.style.setProperty(
        "--page-width",
        `${event.target.value}px`
      );
    });
    viewModeButton.addEventListener("click", () => {
      document.body.classList.toggle("single");
      viewModeButton.textContent =
        document.body.classList.contains("single")
          ? "Two pages"
          : "Single page";
    });
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      themeButton.textContent =
        document.body.classList.contains("dark")
          ? "Light mode"
          : "Dark mode";
    });
    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error(
          "Fullscreen mode could not be activated.",
          error
        );
      }
    });

    const pageObserver = new IntersectionObserver(
      entries => {
        const visiblePages = entries
          .filter(entry => entry.isIntersecting)
          .sort(
            (first, second) =>
              first.boundingClientRect.left -
              second.boundingClientRect.left
          );
        if (visiblePages.length === 0) {
          return;
        }
        const pageNumber =
          visiblePages[0].target.id.split("-")[1];
        pageInput.value = pageNumber;
        saveLastPage(pageNumber);
        history.replaceState(
          null,
          "",
          `#page-${pageNumber}`
        );
      },
      {
        threshold: 0.55
      }
    );
    document
      .querySelectorAll(".page")
      .forEach(page => pageObserver.observe(page));

    window.addEventListener("keydown", event => {
      if (event.target === pageInput) {
        return;
      }
      if (
        event.key === "ArrowRight" ||
        event.key === "PageDown"
      ) {
        goToPage(
          Number(pageInput.value) + pageStep()
        );
      }
      if (
        event.key === "ArrowLeft" ||
        event.key === "PageUp"
      ) {
        goToPage(
          Number(pageInput.value) - pageStep()
        );
      }
    });

    /* Resume where you left off */
    const savedPage = loadLastPage();
    const hashPage =
      window.location.hash.match(/page-(\d+)/)?.[1];

    if (hashPage) {
      window.setTimeout(() => {
        goToPage(hashPage);
      }, 100);
    } else if (savedPage > 2) {
      resumeLabel.textContent = `Resume: page ${savedPage}`;
      resumeBtn.classList.add("visible");
      resumeBtn.addEventListener("click", () => {
        goToPage(savedPage);
        resumeBtn.classList.remove("visible");
      });
    }
  </script>
</body>
</html>
